<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan a Block — REVA Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<!--
  ============================================================================
  AR.js — LOCATION-BASED AR (GPS + compass)
  ----------------------------------------------------------------------------
  No marker photos needed. Each block just needs a latitude/longitude.
  Block coordinates and Echo3D model links live in blocks.js (shared with
  search.html). Add lat/lng there - no edits needed in this file.
    ============================================================================
-->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  :root{
    --ink: #0B1220;
    --panel: #142544;
    --paper: #EDE6D3;
    --paper-dim: #B9B3A0;
    --gold: #F2B705;
    --coral: #FF6B4A;
    --line: #2A3F63;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--ink);
    color: var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    height:100%;
  }
  body{ min-height:100vh; display:flex; flex-direction:column; }

  .grain{
    position:fixed; inset:0;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity:0.3;
    pointer-events:none;
    z-index:1;
  }

  header{
    position:relative; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding: 26px clamp(20px,6vw,64px) 0;
  }
  .crumb{
    display:flex; align-items:center; gap:8px;
    text-decoration:none;
    color: var(--paper-dim);
    font-size: 0.85rem;
  }
  .crumb:hover{ color: var(--paper); }
  .crumb svg{ width:14px; height:14px; stroke: currentColor; }
  .mark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1rem;
    color: var(--gold);
  }

  main{
    position:relative; z-index:2;
    flex:1;
    display:flex; flex-direction:column; align-items:center;
    padding: 30px 20px 60px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: clamp(1.9rem, 4.5vw, 2.6rem);
    margin: 6px 0 6px;
    text-align:center;
  }
  .sub{
    color: var(--paper-dim);
    font-size: 0.95rem;
    text-align:center;
    max-width: 42ch;
    margin: 0 0 24px;
  }

  .mode-toggle{
    display:flex; gap:8px;
    margin-bottom: 24px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }
  .mode-toggle button{
    border:none;
    background:none;
    color: var(--paper-dim);
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 0.82rem;
    font-weight:600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor:pointer;
  }
  .mode-toggle button.active{
    background: var(--panel);
    color: var(--paper);
  }

  .viewfinder{
    position:relative;
    width: min(92vw, 460px);
    aspect-ratio: 3/4;
    border-radius: 20px;
    overflow:hidden;
    background: linear-gradient(160deg, #0F1D38, #0A1428);
    border: 1px solid var(--line);
  }
  .viewfinder video{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    filter: saturate(0.9) brightness(0.85);
  }
  .viewfinder .placeholder{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px;
    color: var(--paper-dim);
    text-align:center;
    padding: 0 30px;
    z-index:2;
  }
  .viewfinder .placeholder svg{ width:40px; height:40px; stroke: var(--line); }
  .viewfinder .placeholder .hint{ font-size:0.85rem; }
  .viewfinder .placeholder button.enable{
    margin-top: 6px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 0.85rem;
    font-weight:600;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--gold);
    background: rgba(242,183,5,0.08);
    color: var(--gold);
    cursor:pointer;
  }

  #arContainer{
    position:absolute; inset:0;
    display:none;
  }
  #arContainer.active{ display:block; }
  #arContainer a-scene{
    width:100% !important; height:100% !important;
  }

  .bracket{
    position:absolute;
    width: 34px; height:34px;
    border-color: var(--gold);
    border-style: solid;
    border-width:0;
    opacity: 0.85;
    z-index:5;
    pointer-events:none;
  }
  .bracket.tl{ top:18px; left:18px; border-top-width:3px; border-left-width:3px; border-top-left-radius:8px; }
  .bracket.tr{ top:18px; right:18px; border-top-width:3px; border-right-width:3px; border-top-right-radius:8px; }
  .bracket.bl{ bottom:18px; left:18px; border-bottom-width:3px; border-left-width:3px; border-bottom-left-radius:8px; }
  .bracket.br{ bottom:18px; right:18px; border-bottom-width:3px; border-right-width:3px; border-bottom-right-radius:8px; }

  .scanline{
    position:absolute;
    left:18px; right:18px;
    height:2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    top: 18px;
    opacity:0;
    z-index:5;
    pointer-events:none;
  }
  .scanline.active{ opacity:1; animation: sweep 1.6s ease-in-out infinite; }
  @keyframes sweep{ 0%{ top:18px; } 50%{ top: calc(100% - 20px); } 100%{ top:18px; } }

  .live-tag{
    position:absolute;
    top:14px; left:50%;
    transform: translateX(-50%);
    z-index:6;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--coral);
    background: rgba(11,18,32,0.7);
    border: 1px solid var(--coral);
    border-radius: 999px;
    padding: 3px 10px;
    display:none;
    align-items:center;
    gap:6px;
  }
  .live-tag.on{ display:flex; }
  .live-tag .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--coral);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

  .controls{ display:flex; gap: 14px; margin-top: 26px; }
  button.action{
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 0.9rem;
    font-weight:600;
    padding: 13px 22px;
    border-radius: 10px;
    border:1px solid var(--line);
    background: var(--panel);
    color: var(--paper);
    cursor:pointer;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  button.action:hover{ transform: translateY(-2px); }
  button.action.primary{ border-color: var(--gold); color: var(--gold); }
  button.action.primary:hover{ background: rgba(242,183,5,0.08); }
  button.action:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }

  .result{
    width: min(92vw, 460px);
    margin-top: 30px;
    border-radius: 16px;
    border: 1px dashed var(--line);
    padding: 22px;
    min-height: 88px;
    display:flex;
    align-items:center;
    gap:16px;
    color: var(--paper-dim);
    font-size: 0.9rem;
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .result.filled{
    border-style: solid;
    border-color: var(--coral);
    background: var(--panel);
    align-items:flex-start;
    color: var(--paper);
  }
  .result .tag{
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--coral);
    border: 1px solid var(--coral);
    border-radius: 999px;
    padding: 3px 10px;
    opacity:0;
  }
  .result.filled .tag{ opacity:1; animation: fadeIn 0.4s ease-out 0.1s forwards; }
  .result h3{
    margin:0 0 6px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.15rem;
    opacity:0;
  }
  .result.filled h3{ animation: fadeIn 0.4s ease-out 0.2s forwards; }
  .result p{
    margin:0;
    font-size: 0.88rem;
    line-height:1.55;
    color: var(--paper-dim);
    opacity:0;
  }
  .result.filled p{ animation: fadeIn 0.4s ease-out 0.3s forwards; }
  @keyframes fadeIn{ to{ opacity:1; } }
  .result a.dir{ display:inline-block; margin-top:8px; margin-right:16px; font-size:0.85rem; font-weight:600; color:var(--coral); text-decoration:none; }

  .distance-note{
    margin-top:14px;
    font-size: 0.78rem;
    color: var(--paper-dim);
    text-align:center;
    max-width: 46ch;
  }

  @media (prefers-reduced-motion: reduce){
    .scanline.active{ animation:none; opacity:0.6; }
    .result .tag, .result h3, .result p{ animation:none !important; opacity:1 !important; }
  }
</style>
</head>
<body>

  <div class="grain"></div>

  <header>
    <a class="crumb" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Trail map
    </a>
    <span class="mark">REVA MAP</span>
  </header>

  <main>
    <h1>Scan a block</h1>
    <p class="sub">Open the camera and point it around — nearby blocks will label themselves as you turn.</p>

    <div class="mode-toggle">
      <button id="modeAR" class="active">Live AR (GPS)</button>
      <button id="modeDemo">Demo (no GPS)</button>
    </div>

    <div class="viewfinder" id="viewfinder">

      <!-- Demo camera mode (plain video, manual capture) -->
      <video id="video" autoplay playsinline muted></video>
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/>
          <circle cx="12" cy="12" r="3.2"/>
        </svg>
        <span id="placeholderTitle">Camera is off</span>
        <span class="hint" id="placeholderHint">Tap "Start camera" to begin</span>
        <button class="enable" id="enableSensors" style="display:none;">Enable camera &amp; compass</button>
      </div>

      <!-- AR.js location-based scene (GPS + compass) -->
      <div id="arContainer">
        <a-scene
          id="arScene"
          vr-mode-ui="enabled: false"
          embedded
          arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
          renderer="antialias: true; alpha: true">

          <a-camera gps-new-camera="gpsMinDistance: 2" cursor="rayOrigin: mouse"></a-camera>
          <!-- gps-new-entity-place tags are generated from the BLOCKS array in the script below -->
          <a-entity id="places"></a-entity>
        </a-scene>
      </div>

      <div class="live-tag" id="liveTag"><span class="dot"></span>locating</div>
      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="bracket bl"></div>
      <div class="bracket br"></div>
      <div class="scanline" id="scanline"></div>
    </div>

    <div class="controls">
      <button class="action primary" id="startBtn">Start camera</button>
      <button class="action" id="simulateBtn" disabled>Capture</button>
    </div>

    <div class="result" id="result">
      <span>Nothing detected yet — point the camera toward a block to see what's inside.</span>
    </div>

    <p class="distance-note" id="distanceNote"></p>
  </main>

  <script src="blocks.js"></script>
  <script>
    const demoBlocks = BLOCKS;

    const modeAR = document.getElementById('modeAR');
    const modeDemo = document.getElementById('modeDemo');
    const video = document.getElementById('video');
    const placeholder = document.getElementById('placeholder');
    const placeholderTitle = document.getElementById('placeholderTitle');
    const placeholderHint = document.getElementById('placeholderHint');
    const enableSensors = document.getElementById('enableSensors');
    const arContainer = document.getElementById('arContainer');
    const startBtn = document.getElementById('startBtn');
    const simulateBtn = document.getElementById('simulateBtn');
    const scanline = document.getElementById('scanline');
    const liveTag = document.getElementById('liveTag');
    const result = document.getElementById('result');
    const distanceNote = document.getElementById('distanceNote');
    const placesEntity = document.getElementById('places');

    let currentMode = 'ar';
    let stream = null;
    let arBuilt = false, placesCount = 0;

    function fillResult(block){
      result.classList.remove('filled');
      result.innerHTML = '';
      void result.offsetWidth;
      result.classList.add('filled');
      result.innerHTML = `
        <span class="tag">${block.tag}</span>
        <div>
          <h3>${block.name}</h3>
          <p>${block.desc}</p>
          <a class="dir" href="navigate.html#${block.id}">Get directions</a>
          ${block.viewer ? `<a class="dir" href="${block.viewer}" target="_blank" rel="noopener">View 3D model</a>` : ''}
        </div>
      `;
    }

    // Build one <a-entity gps-new-entity-place> per block, with a text label
    function buildPlaces(){
      if(arBuilt) return placesCount;
      const ready = BLOCKS.filter(b => b.lat != null && b.lng != null);
      ready.forEach(b => {
        const el = document.createElement('a-entity');
        el.setAttribute('gps-new-entity-place', `latitude: ${b.lat}; longitude: ${b.lng};`);
        el.setAttribute('look-at', '[gps-new-camera]');
        el.setAttribute('scale', '14 14 14');
        el.setAttribute('text', `value: ${b.name}; align: center; color: #F2B705; width: 8;`);
        el.setAttribute('geometry', 'primitive: plane; width: 3.2; height: 0.9;');
        el.setAttribute('material', 'color: #0B1220; opacity: 0.82;');
        el.setAttribute('data-block-id', b.id);
        el.addEventListener('click', () => fillResult(b));
        if(b.model){  // Echo3D model floats above the label - tweak position/scale to fit
          const m = document.createElement('a-entity');
          m.setAttribute('gltf-model', b.model);
          m.setAttribute('position', '0 1.5 0');
          m.setAttribute('scale', '0.5 0.5 0.5');
          el.appendChild(m);
        }
        placesEntity.appendChild(el);
      });
      arBuilt = true;
      placesCount = ready.length;
      return placesCount;
    }

    // ---------- Mode switching ----------
    function setMode(mode){
      currentMode = mode;
      modeAR.classList.toggle('active', mode === 'ar');
      modeDemo.classList.toggle('active', mode === 'demo');

      if(mode === 'ar'){
        video.style.display = 'none';
        startBtn.style.display = 'none';
        simulateBtn.style.display = 'none';
        placeholder.style.display = 'flex';
        placeholderTitle.textContent = 'Camera & location needed';
        placeholderHint.textContent = 'Grant access to see nearby blocks';
        enableSensors.style.display = 'inline-block';
      } else {
        arContainer.classList.remove('active');
        liveTag.classList.remove('on');
        video.style.display = 'block';
        startBtn.style.display = 'inline-block';
        simulateBtn.style.display = 'inline-block';
        enableSensors.style.display = 'none';
        if(!stream){
          placeholder.style.display = 'flex';
          placeholderTitle.textContent = 'Camera is off';
          placeholderHint.textContent = 'Tap "Start camera" to begin';
        }
      }
    }
    modeAR.addEventListener('click', () => setMode('ar'));
    modeDemo.addEventListener('click', () => setMode('demo'));

    // ---------- Enable GPS + compass (and camera) for live AR ----------
    enableSensors.addEventListener('click', async () => {
      try {
        // iOS 13+ requires an explicit user-gesture permission request for orientation
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== 'granted') throw new Error('orientation-denied');
        }
        navigator.geolocation.getCurrentPosition(
          () => {
            placeholder.style.display = 'none';
            arContainer.classList.add('active');
            liveTag.classList.add('on');
            const n = buildPlaces();
            distanceNote.textContent = n
              ? 'Labels use GPS + compass — accuracy is roughly 5–15m, so they may drift a little.'
              : 'No block coordinates yet — add lat/lng in blocks.js.';
          },
          () => { placeholderHint.textContent = 'Location access was blocked — check your browser/site permissions.'; },
          { enableHighAccuracy: true }
        );
      } catch (err) {
        placeholderHint.textContent = 'Motion & orientation access was blocked — check your browser/site permissions.';
      }
    });

    // ---------- Demo mode camera (manual capture, no GPS needed) ----------
    startBtn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        placeholder.style.display = 'none';
        startBtn.textContent = 'Camera on';
        startBtn.disabled = true;
        simulateBtn.disabled = false;
      } catch (err) {
        placeholderHint.textContent = 'Camera access was blocked — check your browser permissions.';
      }
    });

    simulateBtn.addEventListener('click', () => {
      scanline.classList.add('active');
      simulateBtn.disabled = true;
      setTimeout(() => {
        scanline.classList.remove('active');
        const pick = demoBlocks[Math.floor(Math.random() * demoBlocks.length)];
        fillResult(pick);
        simulateBtn.disabled = false;
      }, 1400);
    });

    // Start in AR mode by default
    setMode('ar');
  </script>

</body>
</html>

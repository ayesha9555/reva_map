<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search a Location — REVA Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B1220; --panel:#142544; --paper:#EDE6D3; --paper-dim:#B9B3A0; --gold:#F2B705; --coral:#FF6B4A; --line:#2A3F63; }
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; background:var(--ink); color:var(--paper); font-family:'IBM Plex Sans', sans-serif; }
  body{ min-height:100vh; display:flex; flex-direction:column; }
  .grain{ position:fixed; inset:0; background-image:radial-gradient(var(--line) 1px, transparent 1px); background-size:26px 26px; opacity:0.3; pointer-events:none; }
  header{ position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:26px clamp(20px,6vw,64px) 0; }
  .crumb{ display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--paper-dim); font-size:0.85rem; }
  .crumb:hover{ color:var(--paper); }
  .crumb svg{ width:14px; height:14px; stroke:currentColor; }
  .mark{ font-family:'Fraunces', serif; font-weight:600; font-size:1rem; color:var(--coral); }
  main{ position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; padding:30px 20px 70px; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(1.9rem,4.5vw,2.6rem); margin:6px 0; text-align:center; }
  .sub{ color:var(--paper-dim); font-size:0.95rem; text-align:center; max-width:42ch; margin:0 0 28px; }
  .search-box{ width:min(92vw,520px); display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 18px; }
  .search-box:focus-within{ border-color:var(--coral); }
  .search-box svg{ width:20px; height:20px; stroke:var(--paper-dim); flex-shrink:0; }
  .search-box input{ flex:1; background:none; border:none; outline:none; color:var(--paper); font:inherit; font-size:1rem; }
  .search-box input::placeholder{ color:var(--paper-dim); }
  .list{ width:min(92vw,520px); margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .item{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; color:var(--paper); text-decoration:none; transition:border-color 0.2s ease, transform 0.2s ease; }
  .item:hover, .item:focus-visible{ border-color:var(--coral); transform:translateY(-1px); outline:none; }
  .item .no{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--paper-dim); margin-right:10px; }
  .item .go{ color:var(--coral); font-size:0.8rem; font-weight:600; white-space:nowrap; }
  .empty{ color:var(--paper-dim); text-align:center; padding:20px; }
</style>
</head>
<body>
  <div class="grain"></div>
  <header>
    <a class="crumb" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Trail map
    </a>
    <span class="mark">REVA MAP</span>
  </header>

  <main>
    <h1>Where to?</h1>
    <p class="sub">Pick a place and follow the arrow from where you're standing.</p>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="filter" placeholder="Filter places" autocomplete="off">
    </div>
    <div class="list" id="list"></div>
  </main>

  <script src="blocks.js"></script>
  <script>
    const list = document.getElementById('list');
    const filter = document.getElementById('filter');
    function render(){
      const q = filter.value.trim().toLowerCase();
      const items = BLOCKS.filter(b => b.name.toLowerCase().includes(q));
      list.innerHTML = items.length
        ? items.map(b => `<a class="item" href="navigate.html#${b.id}"><span><span class="no">#${b.no}</span>${b.name}</span><span class="go">Navigate →</span></a>`).join('')
        : '<div class="empty">No place matches that.</div>';
    }
    filter.addEventListener('input', render);
    render();
  </script>
</body>
</html>
